openapi: 3.1.0
info:
  title: PickleQueue API
  version: 1.0.0
  description: |
    PickleQueue is a pickleball club management and automated queuing API.

    **Authentication** uses an HTTP-only session cookie set by `/auth/login`.
    Public registration creates a pending account and no normal session; the
    applicant checks status through a short-lived restricted registration
    ticket. Approved applicants activate without email. Authenticated mutations
    also require the `X-CSRF-Token` header returned by `/auth/me`,
    `/auth/login` and `/auth/registration-status`.

    **Platform administration** is a separate `SUPER_ADMIN` role. Club roles
    never grant platform account-management access. Sensitive administrative
    actions require recent password reauthentication.

    **Concurrency** is protected by optimistic versions on sessions, matches,
    rotation runs and queue entries. Critical mutations accept an
    `Idempotency-Key` header. A stale version returns `409` with an error code of
    `CONFLICT`; clients must refresh an authoritative snapshot rather than retry
    with stale data.

    **Public** endpoints require no session and expose only published sessions
    with reduced display names.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Users
  - name: Clubs
  - name: Sessions
  - name: Check-in & Queue
  - name: Matchmaking
  - name: Matches & Scoring
  - name: Public
  - name: Admin
  - name: Health

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Submit a pending registration
      description: Creates a pending user and registration review. No normal session is issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, acceptTerms]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                skillRating: { type: number, minimum: 1, maximum: 7 }
                acceptTerms: { type: boolean, const: true }
      responses:
        '201':
          description: Registration submitted for administrator approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      submitted: { type: boolean }
                      approvalRequired: { type: boolean }
                      status: { type: string, enum: [PENDING_APPROVAL] }
                      user:
                        type: object
                        properties:
                          name: { type: string }
                          email: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in or obtain a restricted registration-status ticket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Normal session or restricted registration ticket
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/RestrictedAuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/registration-status:
    get:
      tags: [Auth]
      summary: Check the current applicant's registration status
      security:
        - registrationCookie: []
      responses:
        '200':
          description: Restricted status and activation eligibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RegistrationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/activate:
    post:
      tags: [Auth]
      summary: Activate an approved account without email
      security:
        - registrationCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptTerms]
              properties:
                displayName: { type: string, maxLength: 50 }
                skillRating: { type: number, minimum: 1, maximum: 7 }
                acceptTerms: { type: boolean, const: true }
      responses:
        '200':
          description: Account activated and normal session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/registration-logout:
    post:
      tags: [Auth]
      summary: Clear the restricted registration ticket
      security: []
      responses:
        '200': { description: Cleared }
  /auth/reauth:
    post:
      tags: [Auth]
      summary: Recently reauthenticate an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: Reauthenticated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrollment for a Super Admin
      description: Accepts a normal Super Admin session or a short-lived MFA setup ticket.
      security: []
      responses:
        '200':
          description: One-time enrollment secret and authenticator URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MfaSetupResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Verify a TOTP code and enable MFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: MFA enabled; a normal session is issued when using a setup ticket
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete a Super Admin MFA login challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: MFA verified and normal session issued
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/status:
    get:
      tags: [Auth]
      summary: Get MFA status for the current Super Admin
      responses:
        '200': { description: MFA status }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/claim:
    post:
      tags: [Auth]
      summary: Redeem a one-time administratively created account claim
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, acceptTerms]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
                displayName: { type: string, maxLength: 50 }
                acceptTerms: { type: boolean, const: true }
      responses:
        '200':
          description: Account activated and normal session issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/recover:
    post:
      tags: [Auth]
      summary: Redeem a one-time administrator-issued recovery credential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed and sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current account, memberships and CSRF token
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify an email token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Generate a new email verification token
      responses:
        '200': { description: Token generated }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset token (always returns sent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset token generated if the account exists }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password and revoke all sessions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/profile:
    get:
      tags: [Users]
      summary: Get my profile
      responses:
        '200': { description: Profile }
    patch:
      tags: [Users]
      summary: Update my profile and skill rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                displayName: { type: string, maxLength: 50 }
                skillRating: { type: number, minimum: 1, maximum: 7 }
                bio: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200': { description: Updated profile }
  /users/me/stats:
    get:
      tags: [Users]
      summary: Player statistics
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlayerStats' }
  /users/me/upcoming:
    get:
      tags: [Users]
      summary: My upcoming and live registrations
      responses:
        '200': { description: Upcoming sessions }
  /users/me/matches:
    get:
      tags: [Users]
      summary: Completed match history
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: Match history page }
  /users/me/notifications:
    get:
      tags: [Users]
      summary: Notifications
      responses:
        '200': { description: Notifications }

  /clubs:
    get:
      tags: [Clubs]
      summary: Discover clubs
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Public club summaries }
    post:
      tags: [Clubs]
      summary: Create a club (creator becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 600 }
                location: { type: string, maxLength: 120 }
                joinPolicy:
                  type: string
                  enum: [OPEN, APPROVAL, INVITE_ONLY]
      responses:
        '201': { description: Club created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clubs/{clubId}:
    get:
      tags: [Clubs]
      summary: Club summary (public fields; viewer role when a member)
      security: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Club }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Clubs]
      summary: Update club details
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                location: { type: [string, 'null'] }
                joinPolicy: { type: string, enum: [OPEN, APPROVAL, INVITE_ONLY] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Club updated }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/members:
    get:
      tags: [Clubs]
      summary: List members (emails visible to club admins)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Members }
  /clubs/{clubId}/members/{membershipId}:
    patch:
      tags: [Clubs]
      summary: Change a member role or status (owner only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Membership updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Clubs]
      summary: Remove a member (owner only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Member removed }
  /clubs/{clubId}/join:
    post:
      tags: [Clubs]
      summary: Join or request membership
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '201': { description: Active membership or pending request }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/leave:
    post:
      tags: [Clubs]
      summary: Leave a club (owner must transfer first)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Left }
  /clubs/{clubId}/transfer:
    post:
      tags: [Clubs]
      summary: Transfer ownership to an active member (owner only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Ownership transferred }
  /clubs/{clubId}/archive:
    post:
      tags: [Clubs]
      summary: Archive a club and cancel its upcoming sessions (owner only)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Archived }
        '409': { description: Live sessions must be finished first }
  /clubs/{clubId}/invitations:
    get:
      tags: [Clubs]
      summary: List invitations (club admins)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Invitations }
    post:
      tags: [Clubs]
      summary: Invite a player or Queue Master
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [PLAYER, QUEUE_MASTER] }
      responses:
        '201':
          description: Invitation created; development token when enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitation: { $ref: '#/components/schemas/Invitation' }
                      devInvitationToken: { type: [string, 'null'] }
  /clubs/invitations/accept:
    post:
      tags: [Clubs]
      summary: Accept an invitation matching the signed-in email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Membership activated }
        '400': { $ref: '#/components/responses/BadRequest' }
  /clubs/{clubId}/courts:
    get:
      tags: [Clubs]
      summary: List club courts
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200': { description: Courts }
    post:
      tags: [Clubs]
      summary: Create a court (club admin)
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                sortOrder: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '201': { description: Court created }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/courts/{courtId}:
    patch:
      tags: [Clubs]
      summary: Update a court
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: courtId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Court updated }
    delete:
      tags: [Clubs]
      summary: Deactivate a court (historical references preserved)
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: courtId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Court deactivated }

  /clubs/{clubId}/sessions:
    get:
      tags: [Sessions]
      summary: List sessions for a club
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Sessions }
    post:
      tags: [Sessions]
      summary: Create a draft (or schedule and publish) session
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startsAt, endsAt, timezone, capacity, courtIds]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                venue: { type: string, maxLength: 150 }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                timezone: { type: string, example: America/Chicago }
                capacity: { type: integer, minimum: 2, maximum: 200 }
                format: { type: string, enum: [SINGLES, DOUBLES] }
                registrationPolicy: { type: string, enum: [OPEN, APPROVAL, INVITE_ONLY] }
                checkInPolicy: { type: string, enum: [SELF, MANAGER, SELF_AND_MANAGER] }
                published: { type: boolean }
                allowLateArrivals: { type: boolean }
                courtIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                matchmaking:
                  $ref: '#/components/schemas/MatchmakingConfig'
                scoring:
                  $ref: '#/components/schemas/ScoringConfig'
      responses:
        '201': { description: Session }
        '400': { $ref: '#/components/responses/BadRequest' }
  /sessions/{sessionId}:
    get:
      tags: [Sessions]
      summary: Session detail with viewer registration and counts
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Session detail }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Sessions]
      summary: Update a session before it starts
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Updated session }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/status:
    post:
      tags: [Sessions]
      summary: Transition session status
      description: |
        Allowed transitions: DRAFT→SCHEDULED, SCHEDULED→CHECK_IN_OPEN,
        CHECK_IN_OPEN→LIVE, LIVE→COMPLETED, and any non-terminal→CANCELLED.
        Going live requires the minimum number of checked-in players (4 doubles, 2 singles).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [DRAFT, SCHEDULED, CHECK_IN_OPEN, LIVE, COMPLETED, CANCELLED]
                reason: { type: string, maxLength: 300 }
                force: { type: boolean, default: false }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Session after transition }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/publish:
    post:
      tags: [Sessions]
      summary: Enable or disable the public link
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [published]
              properties:
                published: { type: boolean }
      responses:
        '200': { description: Publication changed }
  /sessions/{sessionId}/public-link:
    get:
      tags: [Sessions]
      summary: Get public and QR check-in links (club admins)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Links }
  /sessions/{sessionId}/register:
    post:
      tags: [Check-in & Queue]
      summary: Register for a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '201': { description: Registered or pending approval }
        '409': { description: Full, duplicate or registration closed }
    delete:
      tags: [Check-in & Queue]
      summary: Withdraw my registration
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Withdrawn }
  /sessions/{sessionId}/registrations:
    get:
      tags: [Check-in & Queue]
      summary: Participant board (club admins)
      description: |
        Returns registered players, active guests and a merged participant list.
        The legacy `registrations` array remains registered-player-only.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Registrations, guests, merged participants, counts and capacity }
  /sessions/{sessionId}/registrations/{registrationId}:
    patch:
      tags: [Check-in & Queue]
      summary: Approve, reject or mark a registration as a no-show
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: registrationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT, NO_SHOW] }
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: Updated registration }
  /sessions/{sessionId}/guests:
    post:
      tags: [Check-in & Queue]
      summary: Add a guest player (Queue Master)
      description: |
        Creates a session-scoped participant without an account. Requires
        name, gender and the existing 1-7 skill rating. `addToQueue` creates the
        queue entry in the same transaction. Supports an `Idempotency-Key`
        header so a retried submission cannot create two guests.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGuestRequest' }
      responses:
        '201': { description: Guest created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Session full, closed or late arrivals disabled }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sessions/{sessionId}/guests/{guestId}:
    patch:
      tags: [Check-in & Queue]
      summary: Edit a guest player (Queue Master)
      description: |
        Skill changes are rejected while the guest is in an active match. Match
        history keeps its name and skill snapshots.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: guestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGuestRequest' }
      responses:
        '200': { description: Guest updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Active match restriction or stale version }
    delete:
      tags: [Check-in & Queue]
      summary: Remove a guest player (Queue Master)
      description: Soft-removes the guest and ends queue participation. Repeating the request is safe.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: guestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Guest removed }
        '409': { description: Guest is in an active match }
  /sessions/{sessionId}/guests/{guestId}/enqueue:
    post:
      tags: [Check-in & Queue]
      summary: Add a guest to the active queue (Queue Master)
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: guestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Guest queued }
        '200': { description: Guest was already queued }
        '409': { description: Guest removed, session closed or active match }
  /sessions/{sessionId}/checkins:
    post:
      tags: [Check-in & Queue]
      summary: Check in myself or a player (Queue Master)
      description: Registration and attendance are separate. Duplicate check-in is idempotent.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, description: Queue Master only }
                method: { type: string, enum: [SELF, MANAGER, QR] }
                reason: { type: string }
      responses:
        '200': { description: Checked in }
        '403': { description: Policy requires a Queue Master }
        '409': { description: Not approved, session full or check-in closed }
  /sessions/{sessionId}/queue:
    get:
      tags: [Check-in & Queue]
      summary: Queue snapshot with positions and estimated waits
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/QueueSnapshot' }
  /sessions/{sessionId}/queue/pause:
    post:
      tags: [Check-in & Queue]
      summary: Pause queue participation (or another player as a Queue Master)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, description: Registered player user id }
                participantId: { type: string, description: User id or guest id }
                reason: { type: string }
      responses:
        '200': { description: Paused }
  /sessions/{sessionId}/queue/resume:
    post:
      tags: [Check-in & Queue]
      summary: Resume queue participation with prior wait preserved
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, description: Registered player user id }
                participantId: { type: string, description: User id or guest id }
                reason: { type: string }
      responses:
        '200': { description: Resumed }
  /sessions/{sessionId}/leave:
    post:
      tags: [Check-in & Queue]
      summary: Leave the session (not while playing)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, description: Registered player user id }
                participantId: { type: string, description: User id or guest id }
                reason: { type: string }
      responses:
        '200': { description: Left }
        '409': { description: Active match }
  /sessions/{sessionId}/live:
    get:
      tags: [Sessions]
      summary: Composite live snapshot (session, queue, courts, matches, preview)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Live snapshot with session version }
  /sessions/{sessionId}/rotations/preview:
    post:
      tags: [Matchmaking]
      summary: Generate a rotation preview
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxAssignments: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '201':
          description: Preview with assignments, reasons, metrics and expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Rotation' }
        '409': { description: Session is not live or all courts are occupied }
  /sessions/{sessionId}/rotations/commit:
    post:
      tags: [Matchmaking]
      summary: Atomically commit a preview
      description: |
        The server revalidates every player, registration, rest state, court and
        session version inside one transaction. A stale or expired preview is
        rejected. Committing the same rotation again returns its existing matches.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rotationId, expectedSessionVersion]
              properties:
                rotationId: { type: string }
                expectedSessionVersion: { type: integer, minimum: 1 }
      responses:
        '201': { description: Matches created }
        '200': { description: Rotation already committed; existing matches returned }
        '409': { $ref: '#/components/responses/Conflict' }
  /sessions/{sessionId}/rotations/latest:
    get:
      tags: [Matchmaking]
      summary: Latest preview, with a stale flag
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Rotation or null }
  /sessions/{sessionId}/rotations/{rotationId}/cancel:
    post:
      tags: [Matchmaking]
      summary: Cancel a pending preview
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: rotationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancelled }

  /matches/{matchId}:
    get:
      tags: [Matches & Scoring]
      summary: Match detail with version and score state
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Match
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Match' }
  /matches/{matchId}/start:
    post:
      tags: [Matches & Scoring]
      summary: Start a ready match
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200': { description: Match started or already started }
  /matches/{matchId}/score-events:
    post:
      tags: [Matches & Scoring]
      summary: Award one rally point
      description: |
        `expectedVersion` must equal the current match version. `Idempotency-Key`
        prevents a network retry from awarding twice.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team, expectedVersion]
              properties:
                team: { type: string, enum: [A, B] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Point recorded, with awaitingCompletion when the match is decided
        '409': { description: Stale version, match not in progress or already awaiting completion }
  /matches/{matchId}/undo:
    post:
      tags: [Matches & Scoring]
      summary: Undo the last rally point (in-progress matches only)
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Score rebuilt from active point events }
  /matches/{matchId}/complete:
    post:
      tags: [Matches & Scoring]
      summary: Complete a match that has reached a winning condition
      description: |
        Idempotent. Updates the result, player game/win counters, rest state,
        releases the court and returns players to the queue in one transaction.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '201': { description: Match completed }
        '200': { description: Already completed }
        '409': { description: No winning condition or stale version }
  /matches/{matchId}/correction:
    post:
      tags: [Matches & Scoring]
      summary: Correct a completed match result (authorized Queue Master)
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [games, reason]
              properties:
                games:
                  type: array
                  items:
                    type: object
                    properties:
                      a: { type: integer }
                      b: { type: integer }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: Corrected and audited }
        '422': { description: Invalid game sequence }
  /matches/{matchId}/events:
    get:
      tags: [Matches & Scoring]
      summary: Append-only score event history (club admins)
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200': { description: Score events }

  /checkins/qr:
    post:
      tags: [Check-in & Queue]
      summary: Check in using a session QR token as the authenticated player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Checked in }
        '401': { description: Authentication required; the token is not identity }

  /public/sessions/{publicId}:
    get:
      tags: [Public]
      summary: Published session overview, live courts and results
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicId'
      responses:
        '200': { description: Public session projection }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/sessions/{publicId}/matches:
    get:
      tags: [Public]
      summary: Public live and upcoming matches
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicId'
      responses:
        '200': { description: Matches }
  /public/sessions/{publicId}/results:
    get:
      tags: [Public]
      summary: Public completed results
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicId'
      responses:
        '200': { description: Results }
  /public/clubs/{slug}:
    get:
      tags: [Public]
      summary: Public club profile and published sessions
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public club }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/overview:
    get:
      tags: [Admin]
      summary: Platform overview and pending review summary
      responses:
        '200': { description: Overview }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/registrations:
    get:
      tags: [Admin]
      summary: List registration reviews with pagination and search
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Registration review page }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/registrations/{registrationId}:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Registration review detail
      responses:
        '200': { description: Registration review detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/registrations/{registrationId}/approve:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Approve a pending registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Approved registration }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/registrations/{registrationId}/reject:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Reject a pending registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                internalReason: { type: string, maxLength: 1000 }
                publicReason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Rejected registration }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/registrations/{registrationId}/reopen:
    parameters:
      - name: registrationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Reopen a rejected registration for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Reopened registration }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users:
    get:
      tags: [Admin]
      summary: Server-side user directory
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, APPROVED_PENDING_ACTIVATION, ACTIVE, SUSPENDED, DEACTIVATED, DELETED]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: User page }
    post:
      tags: [Admin]
      summary: Create an approved account with a one-time claim credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                displayName: { type: string, maxLength: 50 }
                skillRating: { type: number, minimum: 1, maximum: 7 }
                note: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Account created; claim token returned once }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Account detail and audit history
      responses:
        '200': { description: Account detail }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Update allowlisted profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                displayName: { type: string, maxLength: 50 }
                skillRating: { type: number, minimum: 1, maximum: 7 }
                bio: { type: [string, 'null'], maxLength: 300 }
                avatarColor: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$' }
      responses:
        '200': { description: Updated account }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Soft-delete an account after recent reauthentication
      responses:
        '200': { description: Account soft-deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/suspend:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Suspend an account and revoke sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Account suspended }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/reactivate:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Reactivate a suspended account
      responses:
        '200': { description: Account reactivated }
  /admin/users/{userId}/restore:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Restore a soft-deleted account without restoring old sessions
      responses:
        '200': { description: Account restored }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/recovery:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Generate a single-use no-SMTP recovery credential
      responses:
        '200': { description: Recovery credential returned once }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/claim:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Regenerate a one-time account claim credential
      responses:
        '200': { description: Claim credential returned once }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/revoke-sessions:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Revoke all account and registration sessions
      responses:
        '200': { description: Sessions revoked }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Administrative audit history
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        '200': { description: Audit page }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pq_session
    registrationCookie:
      type: apiKey
      in: cookie
      name: pq_registration
    mfaCookie:
      type: apiKey
      in: cookie
      name: pq_mfa
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ClubId:
      name: clubId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    MatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string }
    PublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 100 }
  schemas:
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Me' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    MfaSetupResponse:
      type: object
      properties:
        secret: { type: string }
        otpauthUri: { type: string }
    RestrictedAuthResponse:
      type: object
      properties:
        restricted: { type: boolean, const: true }
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED_PENDING_ACTIVATION, REJECTED]
        registration: { $ref: '#/components/schemas/RegistrationStatus' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    RegistrationStatus:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        accountStatus:
          type: string
          enum: [PENDING_APPROVAL, APPROVED_PENDING_ACTIVATION, ACTIVE, SUSPENDED, DEACTIVATED, DELETED]
        registrationStatus:
          type: [string, 'null']
          enum: [PENDING, APPROVED, REJECTED, null]
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        publicReason: { type: [string, 'null'] }
        canActivate: { type: boolean }
        restricted: { type: boolean }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Me:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        emailVerified: { type: boolean }
        platformRole: { type: string, enum: [USER, SUPER_ADMIN] }
        accountStatus:
          type: string
          enum: [PENDING_APPROVAL, APPROVED_PENDING_ACTIVATION, ACTIVE, SUSPENDED, DEACTIVATED, DELETED]
        activatedAt: { type: [string, 'null'], format: date-time }
        profile:
          type: object
          nullable: true
          properties:
            displayName: { type: string }
            skillRating: { type: number }
            bio: { type: [string, 'null'] }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        csrfToken: { type: string }
    Membership:
      type: object
      properties:
        clubId: { type: string }
        clubName: { type: string }
        clubSlug: { type: string }
        role: { type: string, enum: [OWNER, QUEUE_MASTER, PLAYER] }
        status: { type: string }
    Invitation:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        expiresAt: { type: string, format: date-time }
    MatchmakingConfig:
      type: object
      properties:
        strategy: { type: string, enum: [HYBRID, SKILL_FIRST, FAIRNESS_FIRST] }
        format: { type: string, enum: [SINGLES, DOUBLES] }
        preferredSkillSpread: { type: number, minimum: 0, maximum: 3 }
        maxSkillSpread: { type: number, minimum: 0.25, maximum: 4 }
        widenAfterMinutes: { type: integer }
        minRestMinutes: { type: integer }
        partnerPenalty: { type: number }
        opponentPenalty: { type: number }
        starvationMaxGap: { type: integer }
        maxGamesPerPlayer: { type: [integer, 'null'] }
        autoAssign: { type: boolean }
        allowMixedSkillFallback: { type: boolean }
    ScoringConfig:
      type: object
      properties:
        mode: { type: string, enum: [RALLY] }
        targetScore: { type: integer, enum: [11, 15, 21] }
        winByTwo: { type: boolean }
        pointCap: { type: [integer, 'null'] }
        bestOf: { type: integer, enum: [1, 3] }
    GuestPlayer:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        displayName: { type: string }
        name: { type: string }
        gender: { type: string, enum: [FEMALE, MALE, NON_BINARY, PREFER_NOT_TO_SAY] }
        skillRating: { type: number, minimum: 1, maximum: 7 }
        participantType: { type: string, enum: [GUEST] }
        participantId: { type: string }
        status: { type: string, enum: [ACTIVE, REMOVED] }
        version: { type: integer }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        removedAt: { type: [string, 'null'], format: date-time }
        queueState: { type: [string, 'null'] }
    CreateGuestRequest:
      type: object
      required: [displayName, gender, skillRating]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        gender: { type: string, enum: [FEMALE, MALE, NON_BINARY, PREFER_NOT_TO_SAY] }
        skillRating: { type: number, minimum: 1, maximum: 7, multipleOf: 0.25 }
        addToQueue: { type: boolean, default: false }
    UpdateGuestRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        gender: { type: string, enum: [FEMALE, MALE, NON_BINARY, PREFER_NOT_TO_SAY] }
        skillRating: { type: number, minimum: 1, maximum: 7, multipleOf: 0.25 }
        expectedVersion: { type: integer, minimum: 1 }
    QueueSnapshot:
      type: object
      properties:
        sessionId: { type: string }
        version: { type: integer }
        counts:
          type: object
          properties:
            checkedIn: { type: integer }
            registered: { type: integer }
            guests: { type: integer }
            waiting: { type: integer }
            playing: { type: integer }
            paused: { type: integer }
            pending: { type: integer }
        queue:
          type: array
          items:
            type: object
            properties:
              participantId: { type: string }
              participantType: { type: string, enum: [REGISTERED, GUEST] }
              userId: { type: [string, 'null'] }
              guestId: { type: [string, 'null'] }
              gender: { type: [string, 'null'] }
              displayName: { type: string }
              skillRating: { type: number }
              state: { type: string }
              gamesPlayed: { type: integer }
              waitingMinutes: { type: integer }
              position: { type: [integer, 'null'] }
              estimatedWaitMinutes: { type: [integer, 'null'] }
        self:
          type: [object, 'null']
    Rotation:
      type: object
      properties:
        rotationId: { type: string }
        sessionVersion: { type: integer }
        stale: { type: boolean }
        expiresAt: { type: string, format: date-time }
        assignments:
          type: array
          items:
            type: object
            properties:
              courtName: { type: string }
              teamA: { type: array, items: { $ref: '#/components/schemas/SelectedPlayer' } }
              teamB: { type: array, items: { $ref: '#/components/schemas/SelectedPlayer' } }
              teamRatingA: { type: number }
              teamRatingB: { type: number }
              teamBalance: { type: number }
              skillSpread: { type: number }
              reasons: { type: array, items: { type: string } }
              warnings: { type: array, items: { type: string } }
        bench:
          type: array
          items:
            type: object
            properties:
              displayName: { type: string }
              reason: { type: string }
    SelectedPlayer:
      type: object
      properties:
        queueEntryId: { type: string }
        userId: { type: string, description: Participant id (user id or guest id) }
        participantType: { type: string, enum: [REGISTERED, GUEST] }
        displayName: { type: string }
        skill: { type: number }
        gamesPlayed: { type: integer }
        waitMinutes: { type: number }
    Match:
      type: object
      properties:
        id: { type: string }
        publicId: { type: string }
        status:
          {
            type: string,
            enum: [PROPOSED, RESERVED, READY, IN_PROGRESS, COMPLETED, CANCELLED, CORRECTED],
          }
        court:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        version: { type: integer }
        currentGame:
          type: object
          properties:
            a: { type: integer }
            b: { type: integer }
        gamesWonA: { type: integer }
        gamesWonB: { type: integer }
        winnerTeam: { type: [string, 'null'], enum: [A, B, null] }
        servingTeam: { type: [string, 'null'], enum: [A, B, null] }
        awaitingCompletion: { type: boolean }
        teams:
          type: object
          properties:
            A: { type: array, items: { $ref: '#/components/schemas/MatchPlayer' } }
            B: { type: array, items: { $ref: '#/components/schemas/MatchPlayer' } }
    MatchPlayer:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        displayName: { type: string }
        skillRating: { type: number }
    PlayerStats:
      type: object
      properties:
        clubs: { type: integer }
        sessionsAttended: { type: integer }
        matchesPlayed: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number }
        unreadNotifications: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing club permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Stale version, duplicate or invalid state transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Zod request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - sessionCookie: []
    csrfToken: []
